services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    volumes:
      - ./homeassistant/config:/config
    ports:
      - "8123:8123"
    restart: unless-stopped
    networks:
      - synk-flow

  esphome:
    container_name: esphome
    image: ghcr.io/esphome/esphome
    volumes:
      - ./esphome/config:/config
    ports:
      - "6052:6052"
    restart: unless-stopped
    networks:
      - synk-flow

  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - /opt/stage9software/mosquitto/data:/mosquitto/data
      - /opt/stage9software/mosquitto/log:/mosquitto/log
    ports:
      - "1883:1883"
    restart: unless-stopped
    networks:
      - synk-flow

  postgres:
    container_name: postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-synkflow}
      POSTGRES_USER: ${POSTGRES_USER:-synkflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synkflow_dev_password}
    volumes:
      - /opt/stage9software/postgres/data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-synkflow} -d ${POSTGRES_DB:-synkflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - synk-flow

  synkflow-api:
    container_name: synkflow-api
    image: registry.stage9software.com/synkflow-api:latest
    pull_policy: always
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      - ConnectionStrings__Default=Host=postgres;Port=5432;Database=${POSTGRES_DB:-synkflow};Username=${POSTGRES_USER:-synkflow};Password=${POSTGRES_PASSWORD:-synkflow_dev_password}
      - Mqtt__Host=mosquitto
      - Mqtt__Port=1883
    volumes:
      - /opt/stage9software/synkflow-api/data:/app/data
    ports:
      - "5174:8080"
    restart: unless-stopped
    networks:
      - synk-flow

networks:
  synk-flow:
    name: synk-flow
